  <!-- TABLERO DEL PROYECTO -->

<main class="project-board">

  

</main>


<script>

document.addEventListener("DOMContentLoaded", async () => {

  const params = new URLSearchParams(window.location.search);

  const serie = params.get("serie");

  const board = document.querySelector(".project-board");

  if (!serie) {
    board.innerHTML = "<p>Proyecto no encontrado.</p>";
    return;
  }

  try {

    const response = await fetch("projects.html");

    const html = await response.text();

    const parser = new DOMParser();

    const doc = parser.parseFromString(
      html,
      "text/html"
    );

    const project = doc.getElementById(
      "serie-" + serie
    );

    if (!project) {
      board.innerHTML = "<p>Proyecto no encontrado.</p>";
      return;
    }

    const images = project.querySelectorAll(
      ".work-images img"
    );

    board.innerHTML = "";

    images.forEach((image, index) => {

      const link = document.createElement("a");

      link.className = "board-photo";

      link.href =
        "projects.html?serie=" +
        serie +
        "&photo=" +
        (index + 1) +
        "#serie-" +
        serie;

      const newImage = document.createElement("img");

      newImage.src = image.getAttribute("src");

      newImage.alt =
        image.getAttribute("alt") || "";

      newImage.loading = "lazy";

      newImage.decoding = "async";

      link.appendChild(newImage);

      board.appendChild(link);

    });

  }

  catch (error) {

    console.error(error);

    board.innerHTML =
      "<p>Error al cargar el proyecto.</p>";

  }

});

</script>


</body>

</html>
